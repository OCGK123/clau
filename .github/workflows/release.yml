name: Release Clau
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [package.json]
permissions:
  contents: write
concurrency:
  group: release-clau
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish versioned packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          tag="v$version"
          # 릴리스 설명은 이 버전 부분만(예전 버전 변경점까지 쌓이지 않게).
          node scripts/release-notes.mjs "$version" > release-notes.md
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "Clau $version" --notes-file release-notes.md --draft
          else
            gh release edit "$tag" --title "Clau $version" --notes-file release-notes.md
          fi
          gh release upload "$tag" dist/Clau-*.zip dist/Clau-Installer-* dist/latest.json --clobber
          gh release edit "$tag" --draft=false --latest
