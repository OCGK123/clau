name: Release Clau
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [package.json]
permissions:
  contents: write
concurrency:
  group: release-clau
  cancel-in-progress: false
jobs:
  # 세 운영체제 모두에서 테스트가 통과해야 배포한다.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      # 설치 스크립트 문법 검사: 줄바꿈이 깨지거나 오타가 있으면 여기서 걸린다.
      - if: runner.os != 'Windows'
        run: |
          sh -n scripts/install/mac/Install.command
          sh -n scripts/install/linux/install.sh
          sh -n scripts/launcher/clau-installer.sh
  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish versioned packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          tag="v$version"
          # 릴리스 설명은 이 버전 부분만(예전 버전 변경점까지 쌓이지 않게).
          node scripts/release-notes.mjs "$version" > release-notes.md
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "Clau $version" --notes-file release-notes.md --draft
          else
            gh release edit "$tag" --title "Clau $version" --notes-file release-notes.md
          fi
          gh release upload "$tag" dist/Clau-*.zip dist/Clau-Installer-* dist/latest.json --clobber
          gh release edit "$tag" --draft=false --latest
  # 맥 DMG: 서명(ad-hoc)과 hdiutil이 필요해서 맥에서 만든다. 끌어다 놓기만 하면 설치된다.
  mac-dmg:
    needs: release
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/build.mjs mac
      - name: Check the apps open on this Mac
        shell: bash
        run: |
          set -euo pipefail
          for dmg in dist/Clau-mac-*.dmg; do
            mnt="$(mktemp -d)"
            hdiutil attach "$dmg" -mountpoint "$mnt" -nobrowse -quiet
            codesign --verify --deep --strict "$mnt/Clau.app"
            test -L "$mnt/Applications"
            hdiutil detach "$mnt" -quiet
            # 열면 Finder 창이 뜨는 표시(HFS+ finderInfo[2] = 루트 폴더 2)가 들어 있는지 본다.
            dev="$(hdiutil attach "$dmg" -nomount -noverify -noautoopen | awk 'NR==1{print $1}')"
            mark="$(dd if="${dev/disk/rdisk}" bs=4096 count=1 2>/dev/null | xxd -s 1112 -l 4 -p)"
            hdiutil detach "$dev" -quiet
            test "$mark" = "00000002"
          done
      - name: Upload DMGs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          gh release upload "v$version" dist/Clau-mac-*.dmg --clobber
