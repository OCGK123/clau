name: Release Clau
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [package.json]
permissions:
  contents: write
concurrency:
  group: release-clau
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish versioned packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          tag="v$version"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "Clau $version" --notes-file CHANGELOG.md --draft
          fi
          gh release upload "$tag" dist/Clau-*.zip --clobber
          gh release edit "$tag" --draft=false --latest
